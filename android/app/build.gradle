plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'in.forceracing.pitwall'
    compileSdk 34

    defaultConfig {
        applicationId "in.forceracing.pitwall"
        minSdk 24
        targetSdk 34
        versionCode 250
        versionName "2.5.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        buildPython "python3"

        pip {
            install "flask==3.0.3"
            install "werkzeug==3.0.6"
            install "jinja2==3.1.4"
            install "markupsafe==2.1.5"
            install "itsdangerous==2.2.0"
            install "click==8.1.7"
            install "blinker==1.8.2"
            install "flask-wtf==1.2.1"
            install "wtforms==3.1.2"
            install "python-dotenv==1.0.1"
            install "email-validator==2.1.1"
            install "dnspython==2.6.1"
            install "idna==3.7"
            install "openpyxl==3.1.2"
            install "et-xmlfile==1.1.0"
            install "requests==2.32.3"
            install "certifi==2024.7.4"
            install "charset-normalizer==3.3.2"
            install "urllib3==2.2.2"
        }
    }
}
